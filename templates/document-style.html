<style>
/* Resume and letter: one column, real text, dates set like a tool's output. */
@page { size: letter; margin: 0.45in 0.7in; }
:root {
  --ink: #1c1b19; --muted: #6b6860; --rule: #d9d5ca; --accent: #1d4f9c; --paper: #fff;
  --text: Charter, "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media screen and (prefers-color-scheme: dark) {
  :root { --ink: #e6e3da; --muted: #9b978d; --rule: #3a3833; --accent: #93b4f0; --paper: #161614; }
}
* { box-sizing: border-box; }
html { background: var(--paper); color: var(--ink); }
body { margin: 0; font: 10.25pt/1.42 var(--text); font-kerning: normal; }
main {
  max-width: 7.1in; margin: 0 auto; padding-block: 0.5in; padding-inline: 16px;
  /* h3 (role) and the date line after it share a row; everything else spans. */
  display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 1.5em; align-items: baseline;
}
main > * { grid-column: 1 / -1; margin: 0; }

h1 { font: 700 23pt/1.05 var(--text); letter-spacing: -0.015em; }
h1 + p { font: 8pt/1.5 var(--mono); color: var(--muted); margin-top: 5pt; }
h1 + p a { text-decoration: none; }

h2 {
  display: flex; align-items: center; gap: 0.7em; margin-top: 12pt; margin-bottom: 1pt;
  font: 500 8pt/1 var(--mono); text-transform: lowercase; letter-spacing: 0.04em; color: var(--accent);
}
h2::after { content: ""; flex: 1; border-top: 1px solid var(--rule); }

h3 { grid-column: 1; margin-top: 7pt; font: 600 10.25pt/1.3 var(--text); }
main > h3 + p {
  grid-column: 2; margin-top: 7pt; text-align: right; white-space: nowrap;
  font: 8.5pt/1.3 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums;
}

p { margin-top: 5pt; }
/* Roles with no bullets stack tight, like a log. */
main > h3 + p + h3, main > h3 + p + h3 + p { margin-top: 2.5pt; }
ul { list-style: none; padding: 0; margin-top: 2pt; }
/* Hanging indent, not a positioned marker: Chrome paints positioned elements after
   everything else, which puts every bullet after every heading in the PDF's text and
   breaks resume parsers. */
li { padding-left: 1em; text-indent: -1em; margin-top: 1.5pt; }
li::before { content: "–"; display: inline-block; width: 1em; text-indent: 0; color: var(--muted); }
h2 + ul { margin-top: 5pt; }

a { color: inherit; text-decoration-color: var(--rule); text-underline-offset: 2px; }
strong { font-weight: 600; }
/* Letters are read, not scanned: larger text, room between paragraphs. */
.cover-letter > p:not(h1 + p) { font-size: 11pt; line-height: 1.5; margin-top: 10pt; }
.cover-letter > h1 + p + p { margin-top: 28pt; }
h2, h3 { break-after: avoid; }
li { break-inside: avoid; }

@media print {
  html { background: #fff; color: #1c1b19; }
  main { padding: 0; max-width: none; }
  /* A resume is one page. Tighten leading and section gaps to hold that. */
  body { line-height: 1.27; }
  h2 { margin-top: 6pt; }
  h3, main > h3 + p { margin-top: 5.5pt; }
  p { margin-top: 4pt; }
  li { margin-top: 1pt; }
}
</style>
